{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center">

Login

</h2>


<form method="POST">

{% csrf_token %}


<input
type="text"

name="username"

class="form-control mb-3"

placeholder="Username"

required>


<input
type="password"

name="password"

class="form-control mb-3"

placeholder="Password"

required>


<button
class="btn btn-primary w-100">

Login

</button>

</form>


<p class="mt-3">

Don't have account?

<a href="/register">

Register

</a>

</p>

</div>

</div>

</div>

{% endblock %}
