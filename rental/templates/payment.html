{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">


<div class="card shadow-lg p-5">


<h2 class="mb-4">

💳 Payment Details

</h2>


<hr>



<h4>

🚗 Car:

{{ car.name }}

</h4>



<p>

Daily Rent:

<b>

Rs {{ car.price_per_day }}

</b>

/ day

</p>



<p>

Booking Period:

<b>

{{ booking.start_date }}

</b>

to

<b>

{{ booking.end_date }}

</b>

</p>



<h3 class="text-success">

Total Amount:

Rs {{ booking.total_price }}

</h3>


<hr>



<form method="POST">

{% csrf_token %}



<label>

Card Holder Name

</label>


<input

type="text"

class="form-control mb-3"

placeholder="John Doe"

required

>



<label>

Card Number

</label>


<input

type="text"

class="form-control mb-3"

placeholder="1234 5678 9012 3456"

required

>



<div class="row">


<div class="col-md-6">


<label>

Expiry Date

</label>


<input

type="text"

class="form-control"

placeholder="MM/YY"

required

>


</div>



<div class="col-md-6">


<label>

CVV

</label>


<input

type="password"

class="form-control"

placeholder="123"

required

>


</div>


</div>



<button

class="btn btn-success w-100 mt-4"

>

Confirm Payment ✅

</button>


</form>


</div>


</div>


{% endblock %}
