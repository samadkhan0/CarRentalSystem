<!DOCTYPE html>
<html>

<head>

<title>

🚗 Car Rental System

</title>



<link

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"

rel="stylesheet"

>



   <style>


        .dark-mode{
        
        background:#121212;
        
        color:white;
        
        transition:.3s;
        
        }
        
        
        
        /* Cards */
        
        .dark-mode .card{
        
        background:#1e1e1e;
        
        color:white;
        
        }
        
        
        
        /* Navbar */
        
        .dark-mode .navbar{
        
        background:black !important;
        
        }
        
        
        
        /* Inputs */
        
        .dark-mode .form-control{
        
        background:#2a2a2a;
        
        color:white;
        
        border:none;
        
        }
        
        
        
        /* Footer */
        
        .dark-mode footer{
        
        background:black !important;
        
        }
        
        
        
        /* Outline buttons */
        
        .dark-mode .btn-outline-dark{
        
        color:white;
        
        border:1px solid white;
        
        }
        
        
        .dark-mode .btn-outline-dark:hover{
        
        background:white;
        
        color:black;
        
        }
        
        
        
        /* Dark buttons */
        
        .dark-mode .btn-dark{
        
        background:white;
        
        color:black;
        
        border:none;
        
        }
        
        
        
        /* Review/View buttons */
        
        .dark-mode .btn-outline-primary{
        
        color:white;
        
        border:1px solid white;
        
        }
        
        
        .dark-mode .btn-outline-primary:hover{
        
        background:white;
        
        color:black;
        
        }
        
        
        
        /* Tables */
        
        .dark-mode table{
        
        color:white;
        
        }
        
        
        
        /* Dropdowns */
        
        .dark-mode select{
        
        background:#2a2a2a;
        
        color:white;
        
        }
        
        
        
        /* Modals */
        
        .dark-mode .modal-content{
        
        background:#1e1e1e;
        
        color:white;
        
        }
        
        

    /* Equal card size */

.car-card{

display:flex;

flex-direction:column;

height:100%;

border-radius:15px;

overflow:hidden;

}



/* Card body grows equally */

.car-card .card-body{

display:flex;

flex-direction:column;

justify-content:space-between;

}



/* Buttons spacing */

.car-card .btn{

margin-bottom:8px;

}



/* Hover effect */

.car-card:hover{

transform:translateY(-8px);

box-shadow:

0 10px 25px rgba(

0,

0,

0,

0.3

);

transition:.3s;

cursor:pointer;

}



</style>


</head>



<body>


    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    
        <div class="container">
    
            <a
    
            class="navbar-brand fw-bold text-warning"
    
            href="/"
    
            >
    
            🚗 Car Rental
    
            </a>
    
    
            <!-- Mobile Toggle Button -->
    
            <button
    
                class="navbar-toggler"
    
                type="button"
    
                data-bs-toggle="collapse"
    
                data-bs-target="#navbarContent"
    
            >
    
                <span class="navbar-toggler-icon"></span>
    
            </button>
    
    
            <!-- Navbar Content -->
    
            <div
    
                class="collapse navbar-collapse"
    
                id="navbarContent"
    
            >
    
                <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">
    
    
                    {% if user.is_authenticated %}
    
    
                    <a
    
                    href="{% url 'dashboard' %}"
    
                    class="btn btn-primary"
    
                    >
    
                    Dashboard
    
                    </a>
    
    
                    <a
    
                    href="{% url 'home' %}"
    
                    class="btn btn-success"
    
                    >
    
                    Home
    
                    </a>
    
    
                    <a
    
                    href="{% url 'wishlist' %}"
    
                    class="btn btn-outline-light"
    
                    >
    
                    ❤️ Wishlist
    
                    </a>
    
    
                    <a
    
                    href="#contact"
    
                    class="btn btn-outline-light"
    
                    >
    
                    Contact Us
    
                    </a>
    
    
                    <a
    
                    href="{% url 'profile' %}"
    
                    class="btn btn-outline-light"
    
                    >
    
                    👤 Profile
    
                    </a>
    
    
                    <button
    
                    id="theme-toggle"
    
                    class="btn btn-outline-light"
    
                    onclick="toggleTheme()"
    
                    >
    
                    🌙
    
                    </button>
    
    
                    <a
    
                    href="{% url 'logout' %}"
    
                    class="btn btn-danger"
    
                    >
    
                    Logout
    
                    </a>
    
    
                    {% else %}
    
    
                    <a
    
                    href="{% url 'login' %}"
    
                    class="btn btn-success"
    
                    >
    
                    Login
    
                    </a>
    
    
                    <a
    
                    href="{% url 'register' %}"
    
                    class="btn btn-warning"
    
                    >
    
                    Register
    
                    </a>
    
    
                    {% endif %}
    
    
                </div>
    
            </div>
    
        </div>
    
    </nav>



<!-- Notifications -->

{% if messages %}


<div class="container mt-3">


{% for message in messages %}


<div

class="alert alert-success alert-dismissible fade show shadow"

role="alert"

>


{{ message }}



<button

type="button"

class="btn-close"

data-bs-dismiss="alert"

>

</button>



</div>



{% endfor %}



</div>



{% endif %}





{% block content %}

{% endblock %}

</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



<script>

document.addEventListener(

    "DOMContentLoaded",

    function () {

        document.querySelectorAll(

            ".cancel-booking"

        ).forEach(button => {

            button.addEventListener(

                "click",

                function (e) {

                    e.preventDefault();


                    let url = this.href;


                    Swal.fire({

                        title: "Cancel Booking?",

                        text: "This action cannot be undone!",

                        icon: "warning",

                        showCancelButton: true,

                        confirmButtonColor: "#d33",

                        cancelButtonColor: "#3085d6",

                        confirmButtonText: "Yes, cancel it"

                    }).then((result) => {

                        if (result.isConfirmed) {

                            window.location.href = url;

                        }

                    });

                }

            );

        });

    }

);

</script>

</body>

</html>

<script>


    function toggleTheme(){
    
    
    let body = document.body;
    
    
    body.classList.toggle(
    
    'dark-mode'
    
    );
    
    
    if(
    
    body.classList.contains(
    
    'dark-mode'
    
    )
    
    ){
    
    localStorage.setItem(
    
    'theme',
    
    'dark'
    
    );
    
    
    document.getElementById(
    
    'theme-toggle'
    
    ).innerHTML='☀️';
    
    }
    
    
    else{
    
    
    localStorage.setItem(
    
    'theme',
    
    'light'
    
    );
    
    
    document.getElementById(
    
    'theme-toggle'
    
    ).innerHTML='🌙';
    
    
    }
    
    
    }
    
    
    
    window.onload=function(){
    
    
    let theme=
    
    localStorage.getItem(
    
    'theme'
    
    );
    
    
    if(
    
    theme==='dark'
    
    ){
    
    document.body.classList.add(
    
    'dark-mode'
    
    );
    
    
    document.getElementById(
    
    'theme-toggle'
    
    ).innerHTML='☀️';
    
    }
    
    
    }
    
    
    </script>
